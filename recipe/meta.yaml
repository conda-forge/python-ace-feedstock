{% set name = "python-ace" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/python_ace-{{ version }}.tar.gz
  sha256: 7ab0fe185d34906300830fc3b2e27ddb1619851faac59c69220449711868f1e4
  patches:
    - pybind.patch
    - stdint.patch

build:
  number: 1
  skip: true  # [win]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cmake >=3.15
    - make
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools
    - pybind11
  run:
    - python
    - ase
    - numpy >=2.0,<3
    - setuptools >=77
    - pandas >=2,<4
    - psutil
    - ruamel.yaml
    - scikit-learn <2

test:
  imports:
    - pyace
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/ICAMS/python-ace/
  summary: 'pacemaker - a tool for fitting of interatomic potentials in a general nonlinear Atomic Cluster Expansion (ACE) form'
  description: |
    pacemaker - a tool for fitting of interatomic potentials in a general
    nonlinear Atomic Cluster Expansion (ACE) form.
  license: ASL
  license_family: OTHER
  license_file: LICENSE.md
  doc_url: https://pacemaker.readthedocs.io
  dev_url: https://github.com/ICAMS/python-ace/

extra:
  recipe-maintainers:
    - srmnitc
    - jan-janssen
